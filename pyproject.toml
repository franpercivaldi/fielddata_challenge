[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agrobot-weather-alerts"
version = "0.1.0"
description = "Production-oriented weather alert service for the FieldData challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.6,<5.7",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-json-logger>=3,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
